name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptojournal-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare icon
        run: |
          mkdir -p assets
          cp icon-only.png assets/icon-only.png

      - name: Generate icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: cryptojournal-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoJournal-Pro-APK
          path: cryptojournal-android/android/app/build/outputs/apk/debug/app-debug.apk
